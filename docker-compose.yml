services:
  db:
    image: postgres:17-alpine
    container_name: inventario-ccsf2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario_dev
      POSTGRES_DB: inventario
    # 5433 en el host para no chocar con un Postgres instalado localmente.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
