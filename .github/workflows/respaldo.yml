# Respaldo diario de la base de datos.
#
# Ni Render ni Neon respaldan nada en sus planes gratuitos: el restore por punto
# en el tiempo de Neon cubre apenas 6 horas. Un borrado por error de hace dos
# dias no se recupera de ninguna otra forma, asi que esto NO es opcional.
#
# El archivo queda como artefacto del repositorio, cifrado. El volcado incluye
# los hashes de las contrasenas de las usuarias, asi que se cifra siempre, sin
# importar si el repositorio es privado.

name: Respaldo

on:
  schedule:
    # 07:00 UTC = 01:00 en Guatemala: ya cerro el dia de ventas.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  respaldar:
    runs-on: ubuntu-latest
    steps:
      - name: Generar el volcado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PASSPHRASE: ${{ secrets.RESPALDO_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ] || [ -z "${PASSPHRASE:-}" ]; then
            echo "Faltan secretos. En Settings > Secrets and variables > Actions:"
            echo "  DATABASE_URL         la cadena DIRECTA de Neon (la que NO dice -pooler)"
            echo "  RESPALDO_PASSPHRASE  la clave para descifrar el respaldo; guardarla aparte"
            exit 1
          fi

          # pg_dump, si el argumento no le parece una URI, lo toma como NOMBRE de
          # base y se conecta al socket local. El error que suelta entonces habla
          # de "/var/run/postgresql" y no dice nada del verdadero problema, que
          # casi siempre es que al pegar el secreto se colaron comillas o un
          # espacio. Mejor fallar aca, diciendolo.
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "El secreto DATABASE_URL no empieza con postgresql://"
              echo "Suele ser que al pegarlo se colaron comillas o un espacio."
              echo "Volve a ponerlo con: gh secret set DATABASE_URL"
              exit 1
              ;;
          esac

          NOMBRE="respaldo-$(date -u +%Y-%m-%d)"

          # pg_dump va dentro de un contenedor para fijar la version 17, la misma
          # de Neon. El runner de Ubuntu trae la 16, y un pg_dump mas viejo que el
          # servidor se niega a trabajar.
          # La cadena de DATABASE_URL es la que entiende PRISMA, y trae
          # parametros que PostgreSQL no conoce: connection_limit, pool_timeout,
          # schema. pg_dump habla libpq directo y se niega con
          # "invalid URI query parameter". Asi que se le quitan aca, y no se
          # guarda un segundo secreto casi igual al primero: dos cadenas que hay
          # que mantener a mano terminan desincronizadas justo cuando importa.
          #
          # sslmode SI es de libpq y tiene que sobrevivir: Neon lo exige.
          URL_VOLCADO="$DATABASE_URL"
          for parametro in connection_limit pool_timeout pgbouncer schema socket_timeout statement_cache_size; do
            URL_VOLCADO=$(printf '%s' "$URL_VOLCADO" | sed -E "s/([?&])${parametro}=[^&]*&?/\1/g")
          done
          # Puede quedar un ? o un & colgando al final.
          URL_VOLCADO=$(printf '%s' "$URL_VOLCADO" | sed -E 's/[?&]+$//')
          # Exportada a proposito: `docker run -e VAR` lee del entorno exportado,
          # no de las variables sueltas del script.
          export URL_VOLCADO

          # La otra causa posible del mismo sintoma: que la variable no cruce al
          # contenedor. Se comprueba aparte para no confundir un problema con el
          # otro, y sin imprimir el valor.
          docker run --rm -e URL_VOLCADO postgres:17-alpine \
            sh -c '[ -n "$URL_VOLCADO" ]' \
            || { echo "La cadena no llego al contenedor de Docker."; exit 1; }

          docker run --rm -e URL_VOLCADO postgres:17-alpine \
            sh -c 'pg_dump "$URL_VOLCADO" --no-owner --no-privileges' > "$NOMBRE.sql"

          # Un volcado vacio o truncado es peor que ninguno, porque da falsa
          # tranquilidad. Si no trae el final que escribe pg_dump, se cae aqui.
          if ! grep -q "PostgreSQL database dump complete" "$NOMBRE.sql"; then
            echo "El volcado quedo incompleto; no se sube nada."
            exit 1
          fi

          gzip -9 "$NOMBRE.sql"
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --quiet \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$NOMBRE.sql.gz.gpg" "$NOMBRE.sql.gz"
          rm "$NOMBRE.sql.gz"

          echo "ARCHIVO=$NOMBRE.sql.gz.gpg" >> "$GITHUB_ENV"
          echo "- \`$NOMBRE.sql.gz.gpg\` ($(du -h "$NOMBRE.sql.gz.gpg" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el respaldo
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVO }}
          path: ${{ env.ARCHIVO }}
          retention-days: 30
          if-no-files-found: error
